name: Build postmarketOS (OPPO A38)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git sudo kpartx curl python3 python3-pip openssl

      - name: Clone pmbootstrap
        run: |
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git ~/pmbootstrap

      - name: Initialize pmbootstrap (Non-Interactive)
        run: |
          cd ~/pmbootstrap
          # Initialize with default answers to clone the official pmaports
          yes "" | ./pmbootstrap.py init || true
          
          # Copy our custom device and kernel packages into the official pmaports tree
          cp -r ${{ github.workspace }}/aports/device/testing/* ~/.local/var/pmbootstrap/cache_git/pmaports/device/testing/
          
          # Configure pmbootstrap for our device
          ./pmbootstrap.py config device oppo-a38
          ./pmbootstrap.py config ui plasma-mobile
          ./pmbootstrap.py config build_pkgs_on_install true

      - name: Generate Checksums
        run: |
          cd ~/pmbootstrap
          ./pmbootstrap.py checksum linux-oppo-a38
          ./pmbootstrap.py checksum device-oppo-a38

      - name: Build Packages
        run: |
          cd ~/pmbootstrap
          ./pmbootstrap.py build linux-oppo-a38
          ./pmbootstrap.py build device-oppo-a38

      - name: Build Rootfs Image
        run: |
          cd ~/pmbootstrap
          echo -e "123456\n123456" | ./pmbootstrap.py install || { tail -n 200 ~/.local/var/pmbootstrap/log.txt; exit 1; }
          ./pmbootstrap.py export

      - name: Generate init_boot and boot images
        run: |
          cd /tmp/postmarketOS-export/
          
          # Copy magiskboot and original images
          cp ${{ github.workspace }}/assets/magiskboot .
          cp ${{ github.workspace }}/assets/init_boot_b.bin .
          cp ${{ github.workspace }}/assets/boot_b.bin .
          chmod +x magiskboot
          
          # --- Repack init_boot ---
          ./magiskboot unpack init_boot_b.bin

          # --- Fix pmOS initramfs /lib collision ---
          # Android's vendor_boot extracts a /lib directory (for /lib/modules).
          # pmOS initramfs has /lib as a symlink to /usr/lib. 
          # We fix this by swapping them in pmOS's ramdisk.
          mkdir pmos_ramdisk
          cd pmos_ramdisk
          zcat ../initramfs | cpio -idm
          rm lib
          mv usr/lib lib
          ln -s ../lib usr/lib
          # We output RAW cpio. magiskboot will automatically compress it to lz4_legacy
          # to match the original init_boot format. This is CRITICAL because the kernel
          # fails to extract a gzip archive if it follows an lz4_legacy vendor_boot ramdisk!
          find . -print0 | cpio --null -o -H newc > ../ramdisk.cpio
          cd ..
          rm -rf pmos_ramdisk

          # We pass our fixed ramdisk.cpio (which is gzip compressed). magiskboot detects gzip and preserves it.
          ./magiskboot repack init_boot_b.bin init_boot-pmos.img
          rm -f ramdisk.cpio kernel dtb boot_signature header
          
          # --- Repack boot ---
          ./magiskboot unpack boot_b.bin
          # Replace original kernel with pmOS kernel
          cp vmlinuz-oppo-a38 kernel
          ./magiskboot repack boot_b.bin boot-pmos.img
          
          # Clean up workspace
          rm -f magiskboot init_boot_b.bin boot_b.bin ramdisk.cpio kernel dtb boot_signature header
          
          # Remove pmbootstrap's invalid boot.img to avoid confusion
          rm -f boot.img

      - name: Upload Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmOS-oppo-a38-image
          path: /tmp/postmarketOS-export/
